apiVersion: batch/v1
kind: Job
metadata:
  name: ml-job-1-light-custom
spec:
  backoffLimit: 0
  completions: 1
  parallelism: 1
  template:
    metadata:
      annotations:
        checkpoint_frequency: '8'
        gradient_update_size: '173'
        loss_reduction_rate: '0.85'
        matrix_size: '259'
        model_partitions: '2'
        train_time: '7'
    spec:
      containers:
      - env:
        - name: MATRIX_SIZE
          value: '259'
        - name: TRAIN_TIME
          value: '7'
        - name: MODEL_PARTITIONS
          value: '2'
        - name: LOSS_REDUCTION_RATE
          value: '0.85'
        - name: GRADIENT_UPDATE_SIZE
          value: '173'
        - name: CHECKPOINT_FREQUENCY
          value: '8'
        - name: USE_EXECUTION_GATE
          value: 'true'
        - name: EXECUTION_GATE
          valueFrom:
            fieldRef:
              fieldPath: metadata.annotations['execution_gate']
        image: micksempar/ml-training:latest
        imagePullPolicy: IfNotPresent
        name: ml-task
      restartPolicy: Never
      schedulerName: custom-scheduler

